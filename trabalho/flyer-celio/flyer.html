<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Flyer Bar do Célio</title>
<style>
  @font-face { font-family: "League Gothic"; src: url("assets/400-normal-1f5def0df34d.woff2") format("woff2"); }
  @font-face { font-family: "Oswald"; src: url("assets/500-normal-80787391b94b.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "Oswald"; src: url("assets/600-normal-80787391b94b.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "Oswald"; src: url("assets/700-normal-80787391b94b.woff2") format("woff2"); font-weight: 700; }
  :root { --vinho: #7a0f1f; --vinho-esc: #3a0610; --ouro: #e9cf8f; --ouro-claro: #f3d58f; --creme: #fff8ee; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--vinho-esc); }
  #arte { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "League Gothic", sans-serif;
    background: radial-gradient(90% 60% at 50% 85%, #5a0a18, var(--vinho-esc) 70%); }
  body.feed #arte { height: 1350px; }

  /* Foto (recorte da placa até os pés) */
  #fotoBox { position: absolute; left: 0; top: 300px; width: 1080px; height: 1060px; overflow: hidden; }
  #foto { position: absolute; left: 0; top: -150px; width: 1080px; height: 1440px; object-fit: cover; filter: contrast(1.06) saturate(1.05); }
  #foto-tom { position: absolute; inset: 0; mix-blend-mode: multiply; background: radial-gradient(80% 60% at 50% 55%, #fff 55%, #b04050 100%); opacity: .55; }
  #foto-fade { position: absolute; inset: 0;
    background: linear-gradient(to bottom, var(--vinho-esc) 0, rgba(58,6,16,0) 7%, rgba(58,6,16,0) 72%, rgba(58,6,16,.9) 92%, var(--vinho-esc) 100%); }
  body.feed #fotoBox { top: 215px; height: 800px; }
  body.feed #foto { top: -160px; }
  body.feed #foto-fade { background: linear-gradient(to bottom, var(--vinho-esc) 0, rgba(58,6,16,0) 8%, rgba(58,6,16,0) 75%, var(--vinho-esc) 100%); }

  /* Topo: logo Fincapé */
  #topo { position: absolute; left: 0; top: 52px; width: 1080px; text-align: center; }
  #topo .sub { font-family: "Oswald"; font-weight: 600; font-size: 30px; letter-spacing: 10px; color: var(--creme); text-shadow: 0 2px 10px rgba(0,0,0,.8); }
  .logo { position: relative; margin: 4px auto 0; width: 470px; height: 194px; }
  .logo div { position: absolute; inset: 0; -webkit-mask: url("assets/fincape.png") center / contain no-repeat; mask: url("assets/fincape.png") center / contain no-repeat; }
  .logo .sombra { background: #2a0309; transform: translate(6px, 8px); }
  .logo .glow { background: #c8202f; filter: blur(22px); opacity: .7; }
  .logo .ouro { background: linear-gradient(180deg, #fff6dc 0%, #f3d58f 35%, #b88a3a 60%, #f6df9e 80%, #a87a2a 100%); }
  body.feed #topo { top: 24px; }
  body.feed .logo { width: 360px; height: 148px; }

  /* Data grande */
  #data { position: absolute; left: 0; top: 1330px; width: 1080px; text-align: center; }
  #data .dia { font-family: "Oswald"; font-weight: 700; font-size: 44px; letter-spacing: 14px; color: var(--creme); }
  #data .num { font-size: 215px; line-height: .86; color: var(--ouro-claro); letter-spacing: 6px;
    text-shadow: 0 10px 0 #2a0309, 0 0 40px rgba(200,32,47,.7); }
  #data .hora { display: inline-block; margin-top: 8px; padding: 8px 26px 6px; border-radius: 12px; background: var(--ouro); color: #4a0711;
    font-size: 52px; letter-spacing: 3px; }
  body.feed #data { top: 1010px; display: flex; align-items: center; justify-content: center; gap: 26px; }
  body.feed #data .dia { font-size: 40px; letter-spacing: 8px; }
  body.feed #data .num { font-size: 140px; }
  body.feed #data .hora { font-size: 44px; padding: 6px 18px 4px; margin-top: 0; }

  /* Frase */
  #frase { position: absolute; left: 0; top: 1700px; width: 1080px; text-align: center; font-family: "Oswald"; font-weight: 600;
    font-size: 34px; letter-spacing: 5px; color: var(--creme); }
  #frase b { color: var(--ouro-claro); font-weight: 700; }
  body.feed #frase { display: none; }

  /* Faixa de informações */
  #faixa { position: absolute; left: 40px; top: 1765px; width: 1000px; height: 130px; border-radius: 22px; overflow: hidden;
    background: linear-gradient(180deg, rgba(122,15,31,.96), rgba(70,6,16,.98)); box-shadow: 0 16px 36px rgba(0,0,0,.55), inset 0 0 0 3px rgba(233,207,143,.9);
    display: flex; align-items: center; padding: 0 36px; gap: 30px; }
  #faixa .nome { font-size: 76px; line-height: .95; color: var(--ouro-claro); letter-spacing: 2px; white-space: nowrap; text-shadow: 0 4px 0 #2a0309; }
  #faixa .div { width: 3px; height: 100px; background: linear-gradient(transparent, var(--ouro), transparent); }
  #faixa .end { font-family: "Oswald"; font-weight: 600; font-size: 30px; color: var(--creme); letter-spacing: 1.5px; line-height: 1.3; }
  #faixa svg { width: 20px; height: 26px; vertical-align: -3px; margin-right: 8px; }
  body.feed #faixa { top: 1185px; height: 140px; }
</style>
</head>
<body>
<div id="arte">
  <div id="fotoBox"><img id="foto" src="assets/foto.jpg" alt="" /><div id="foto-tom"></div><div id="foto-fade"></div></div>

  <div id="topo">
    <div class="sub">ENDEREÇO NOVO DO</div>
    <div class="logo"><div class="sombra"></div><div class="glow"></div><div class="ouro"></div></div>
  </div>

  <div id="data">
    <div class="dia">SÁBADO</div>
    <div class="num">12.12</div>
    <div class="hora">A PARTIR DAS 14H</div>
  </div>

  <div id="frase">CERVEJA BARATA <b>&amp;</b> CINCO HORAS DE MODA</div>

  <div id="faixa">
    <div class="nome">BAR DO CÉLIO</div>
    <div class="div"></div>
    <div class="end"><svg viewBox="0 0 24 32"><path fill="#e9cf8f" d="M12 0C5.4 0 0 5.2 0 11.7 0 20.5 12 32 12 32s12-11.5 12-20.3C24 5.2 18.6 0 12 0zm0 16.5a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg>AV. SÃO NICOLAU, 172 – SANTA LUZIA<br>CAMPO GRANDE - MS</div>
  </div>
</div>
<script>document.body.classList.add(new URLSearchParams(location.search).get("f") || "story");</script>
</body>
</html>
