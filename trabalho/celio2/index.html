<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { width: 100%; height: 100%; }
      #cam { position: absolute; inset: 0; transform-origin: 540px 800px; }
      #cam video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="36.78" data-width="1080" data-height="1920">
      <div id="cam"><video id="video" class="clip" src="assets/chamada.mp4" data-start="0" data-duration="36.78" data-track-index="0" data-has-audio="true" playsinline></video></div>
      <div id="legendas" data-composition-id="legendas" data-composition-src="compositions/legendas.html" data-start="0" data-duration="36.78"
        data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.to("#cam", { scale: 1.1, duration: 0.6, ease: "power2.inOut" }, 25.04);
      tl.to("#cam", { scale: 1.0, duration: 0.6, ease: "power2.inOut" }, 29.14);
      tl.set("#cam", { scale: 1.18 }, 31.01);
      tl.to("#cam", { scale: 1.05, duration: 1.2, ease: "power3.out" }, 31.06);
      tl.to("#cam", { scale: 1.0, duration: 0.6, ease: "power2.inOut" }, 32.66);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
