  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const A = ["#a1", "#a2", "#a3", "#a4"];
      const FLYER = ["#logo", "#selo", "#cidade", "#nomes", ...A];

      // ---------- Estados iniciais ----------
      gsap.set(["#bg-palco2", "#fence", "#bigdate", "#live2", "#live4", "#live3", "#selo", "#cidade", "#warm", "#burst", "#rays", "#flash", "#logo", "#nomes"], { opacity: 0 });
      gsap.set(A, { opacity: 0, y: 700 });
      gsap.set("#logo", { scale: 1, filter: "blur(0px)", y: -466 });
      gsap.set("#bg-palco", { opacity: 1, scale: 1.15 });

      // ---------- 0.0–0.7  Abertura caleidoscópio ----------
      const ks = ["#k1", "#k2", "#k3", "#k4", "#k5", "#k6"];
      const kStart = [[3.2, -38, -40], [2.6, 52, 46], [4.0, 160, 0], [1.8, -120, 30], [3.6, 95, -30], [2.2, -70, 0]];
      ks.forEach((k, i) => {
        tl.fromTo(k, { scale: kStart[i][0], rotation: kStart[i][1], x: kStart[i][2], opacity: 0.9, filter: "blur(6px)" },
          { scale: 1, rotation: 0, x: 0, opacity: 0.9, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 0);
      });
      tl.to("#kaleido", { opacity: 0, duration: 0.25, ease: "power2.in" }, 0.55);
      tl.set("#logo", { scale: 1.08 }, 0.49);
      tl.to("#logo", { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, 0.5);
      tl.to("#bg-palco", { scale: 1.0, duration: 3, ease: "power2.out" }, 0);
      // Clarão de luz atravessando
      tl.fromTo("#leak", { x: -200, opacity: 0 }, { x: 1500, opacity: 1, duration: 0.9, ease: "power2.inOut" }, 0.45);
      tl.to("#leak", { opacity: 0, duration: 0.2 }, 1.36);

      // ---------- 2.9–3.4  Transição para a data ----------
      tl.to("#logo", { scale: 1.6, opacity: 0, filter: "blur(18px)", duration: 0.4, ease: "power3.in" }, 2.85);
      tl.to("#fence", { opacity: 1, duration: 0.35, ease: "power2.inOut" }, 3.0);
      tl.to("#bg-palco2", { opacity: 1, duration: 0.35 }, 3.0);
      tl.set("#logo", { filter: "blur(0px)", scale: 1, y: 0 }, 3.3);

      // ---------- 3.3–5.6  Data gigante ----------
      tl.fromTo("#bigdate", { opacity: 0, scale: 2.4, filter: "blur(22px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, 3.3);
      tl.fromTo("#bigdate .dia", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.4, ease: "power4.out" }, 3.6);
      tl.fromTo("#bigdate .hora", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power4.out" }, 3.85);
      tl.fromTo("#fence", { scale: 1.12 }, { scale: 1.0, duration: 2.4, ease: "power1.out" }, 3.0);
      tl.to("#flash", { opacity: 0.55, duration: 0.05 }, 4.2);
      tl.to("#flash", { opacity: 0, duration: 0.25 }, 4.25);
      tl.to("#bigdate", { opacity: 0, scale: 1.35, filter: "blur(24px)", duration: 0.35, ease: "power3.in" }, 5.25);

      // ---------- 5.7–7.4  Artistas sobem ----------
      A.forEach((a, i) => tl.fromTo(a, { opacity: 0, y: 700 }, { opacity: 1, y: 0, duration: 0.8, ease: "expo.out" }, 5.75 + [0.12, 0, 0.06, 0.18][i]));
      tl.set("#logo", { scale: 0.6, filter: "blur(14px)" }, 5.7);
      tl.to("#logo", { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, 5.75);

      // ---------- 7.4–8.5  Clarão branco e arte completa ----------
      tl.to("#flash", { opacity: 1, duration: 0.12, ease: "power2.in" }, 7.35);
      tl.set(["#fence", "#bg-palco2"], { opacity: 0 }, 7.5);
      tl.set("#bg-palco", { scale: 1.08 }, 7.5);
      tl.set("#logo", { opacity: 1, scale: 1.25 }, 7.5);
      tl.to("#flash", { opacity: 0, duration: 0.7, ease: "power2.out" }, 7.5);
      tl.to("#logo", { scale: 1, duration: 0.7, ease: "expo.out" }, 7.5);
      tl.fromTo("#selo", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 7.9);
      tl.fromTo("#cidade", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 8.0);
      tl.to("#bg-palco", { scale: 1.0, duration: 3.3, ease: "none" }, 7.5);
      tl.set("#nomes", { opacity: 1 }, 8.1);
      ["#n1", "#n2", "#n3"].forEach((n, i) => tl.fromTo(n, { opacity: 0, y: 24, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.35, ease: "power4.out" }, 8.1 + i * 0.12));

      // ---------- 10.9–12.3  Cortes rápidos "ao vivo" ----------
      tl.set("#live2", { opacity: 1 }, 10.9);
      tl.fromTo("#live2", { scale: 1.25 }, { scale: 1.08, duration: 0.47, ease: "power2.out" }, 10.9);
      tl.set("#live2", { opacity: 0 }, 11.37);
      tl.set("#live4", { opacity: 1 }, 11.37);
      tl.fromTo("#live4", { scale: 1.2 }, { scale: 1.05, duration: 0.47, ease: "power2.out" }, 11.37);
      tl.set("#live4", { opacity: 0 }, 11.84);
      tl.set("#live3", { opacity: 1 }, 11.84);
      tl.fromTo("#live3", { scale: 1.2 }, { scale: 1.05, duration: 0.46, ease: "power2.out" }, 11.84);
      tl.set(FLYER, { opacity: 0 }, 11.0);
      tl.set(A, { y: 500 }, 11.0);

      // ---------- 12.3–13.4  Arte se remonta em camadas ----------
      tl.to("#live3", { opacity: 0, duration: 0.15 }, 12.3);
      tl.set("#logo", { scale: 0.55, filter: "blur(14px)" }, 12.3);
      tl.to("#logo", { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, 12.35);
      A.forEach((a, i) => tl.to(a, { opacity: 1, y: 0, duration: 0.55, ease: "expo.out" }, 12.5 + i * 0.07));
      tl.to(["#selo", "#cidade"], { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, 12.9);
      tl.to("#nomes", { opacity: 1, duration: 0.3, ease: "power2.out" }, 12.95);

      // ---------- 13.4–17  Arte com zoom leve, tremidas e flash quente ----------
      tl.fromTo(["#cam", "#topo-cam"], { scale: 1 }, { scale: 1.06, duration: 3.6, ease: "none" }, 13.4);
      tl.to("#warm", { opacity: 0.8, duration: 0.15, ease: "power2.in" }, 14.45);
      tl.to("#warm", { opacity: 0, duration: 0.5, ease: "power2.out" }, 14.6);
      const shake = (t, amp) => {
        const pts = [[1, -0.6], [-0.8, 0.9], [0.6, -1], [-0.4, 0.5], [0.2, -0.2], [0, 0]];
        pts.forEach((p, i) => tl.to(["#cam", "#topo-cam"], { x: p[0] * amp, y: p[1] * amp, duration: 0.04, ease: "none" }, t + i * 0.04));
      };
      shake(7.42, 22); shake(12.35, 16); shake(14.45, 20);

      // ---------- 17.0–17.45  Explosão amarela ----------
      tl.to(["#burst", "#rays"], { opacity: 1, duration: 0.15, ease: "power2.in" }, 17.0);
      tl.fromTo("#rays", { rotation: 0, scale: 0.6 }, { rotation: 40, scale: 1.4, duration: 0.5, ease: "power2.out" }, 17.0);
      tl.to(["#burst", "#rays"], { opacity: 0, duration: 0.3, ease: "power2.out" }, 17.3);

      // ---------- 17.3–18.8  Zoom extremo no logo que recua ----------
      tl.set(["#cam", "#topo-cam"], { scale: 3.4, x: 0, y: 0 }, 17.25);
      tl.to(["#cam", "#topo-cam"], { scale: 1, duration: 1.4, ease: "power3.out" }, 17.3);
      shake(18.7, 10);

      window.__timelines["reel"] = tl;

      // ---------- Fogo, faíscas e bokeh (desenhados a partir do tempo) ----------
      const cv = document.getElementById("fire");
      const ctx = cv.getContext("2d");
      function rng(seed) { return function () { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const r = rng(20122026);
      const flames = Array.from({ length: 0 }, () => ({ side: r() < 0.5 ? 0 : 1, off: r(), life: 0.7 + r() * 0.9, x: r() * 230, sway: 20 + r() * 40, size: 40 + r() * 70, ph: r() * 6.28 }));
      const sparks = Array.from({ length: 70 }, () => ({ x: r() * 1080, off: r(), life: 1.6 + r() * 2.2, drift: (r() - 0.5) * 160, size: 1.5 + r() * 3 }));
      const bokeh = Array.from({ length: 16 }, () => ({ x: r() * 1080, y: 300 + r() * 1200, rad: 40 + r() * 90, sp: 6 + r() * 14, ph: r() * 6.28 }));
      function draw(t) {
        ctx.clearRect(0, 0, 1080, 1920);
        ctx.globalCompositeOperation = "lighter";
        bokeh.forEach((b) => {
          const y = b.y - ((t * b.sp) % 400); const a = 0.06 + 0.05 * Math.sin(t * 0.8 + b.ph);
          const g = ctx.createRadialGradient(b.x, y, 0, b.x, y, b.rad);
          g.addColorStop(0, `rgba(255,170,70,${a})`); g.addColorStop(1, "rgba(255,120,20,0)");
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, y, b.rad, 0, 6.29); ctx.fill();
        });
        flames.forEach((f) => {
          const p = ((t / f.life) + f.off) % 1;
          const baseX = f.side ? 1080 - f.x : f.x;
          const x = baseX + Math.sin(t * 3 + f.ph + p * 4) * f.sway * p;
          const y = 1940 - p * (420 + f.size * 2);
          const s = f.size * (1 - p * 0.85);
          const a = (1 - p) * 0.55;
          const g = ctx.createRadialGradient(x, y, 0, x, y, s);
          g.addColorStop(0, `rgba(255,${200 - p * 120},${80 - p * 60},${a})`);
          g.addColorStop(0.5, `rgba(255,${110 - p * 60},10,${a * 0.6})`);
          g.addColorStop(1, "rgba(180,30,0,0)");
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, s, 0, 6.29); ctx.fill();
        });
        sparks.forEach((s) => {
          const p = ((t / s.life) + s.off) % 1;
          const x = s.x + s.drift * p + Math.sin(t * 5 + s.x) * 8;
          const y = 1900 - p * 1100;
          ctx.fillStyle = `rgba(255,${210 - p * 90},120,${(1 - p) * 0.95})`;
          ctx.beginPath(); ctx.arc(x, y, s.size * (1 - p * 0.5), 0, 6.29); ctx.fill();
        });
      }
      window.addEventListener("hf-seek", (e) => draw(e.detail.time));
      draw(0);
    })();
  </script>
</template>
