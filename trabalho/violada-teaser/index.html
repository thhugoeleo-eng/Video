<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #12061d; }
      #root { width: 100%; height: 100%; position: relative;
        background: radial-gradient(ellipse 70% 40% at 15% 30%, #5a1f6e40, transparent 70%), radial-gradient(ellipse 60% 35% at 90% 12%, #3d1c6b40, transparent 70%), linear-gradient(#150822, #1f0b2e 45%, #0d0516); }
      #bg-bokeh { position: absolute; left: 0; top: 0; }
      #bg-tree { position: absolute; left: -110px; top: 300px; width: 1300px; opacity: .3; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
      .vl { position: absolute; top: 250px; width: 3px; height: 1200px; background: linear-gradient(#b77ad600, #b77ad6 15%, #b77ad6 85%, #b77ad600); opacity: .7; }
      #barra { position: absolute; z-index: 20; left: 0; top: 1310px; width: 1080px; display: flex; justify-content: center; align-items: center; gap: 30px; }
      #barra .lg { height: 190px; }
      #barra .dt { text-align: center; font-family: "Montserrat", sans-serif; font-weight: 800; line-height: 1.05; }
      #barra .dt .s { font-size: 30px; letter-spacing: 8px; padding-left: 8px; color: #e8384a; }
      #barra .dt .d { font-size: 50px; color: #fff; }
      #barra .dt .m { font-family: "Oswald", sans-serif; font-weight: 700; font-size: 70px; color: #d9a8ff; line-height: .95; }
      #barra .ad { height: 120px; }
    </style>
  </head>
  <body>

      <canvas id="bg-bokeh" width="1080" height="1920"></canvas>
      <img id="bg-tree" src="assets/tree2.png" alt="" />
      <div class="vl" style="left:58px" data-layout-ignore></div><div class="vl" style="right:58px" data-layout-ignore></div>
      <audio id="bed" class="clip" src="assets/bed/suspense-bed.wav" data-start="0" data-duration="14.6" data-track-index="10" data-volume="0.45" data-fade-out="0.5"></audio>

      <audio id="sx-q" class="clip" src="assets/sfx/pop-2.mp3" data-start="0.68" data-duration="0.91" data-track-index="13" data-volume="0.40"></audio>
      <audio id="sx-b2" class="clip" src="assets/sfx/whoosh.mp3" data-start="2.55" data-duration="0.57" data-track-index="11" data-volume="0.38"></audio>
      <audio id="sx-n2" class="clip" src="assets/sfx/pop.mp3" data-start="3.93" data-duration="0.72" data-track-index="13" data-volume="0.42"></audio>
      <audio id="sx-b3" class="clip" src="assets/sfx/whoosh-3.mp3" data-start="5.55" data-duration="0.50" data-track-index="11" data-volume="0.38"></audio>
      <audio id="sx-n3" class="clip" src="assets/sfx/pop-2.mp3" data-start="6.93" data-duration="0.91" data-track-index="13" data-volume="0.42"></audio>
      <audio id="sx-b4" class="clip" src="assets/sfx/whoosh-2.mp3" data-start="8.55" data-duration="0.71" data-track-index="11" data-volume="0.38"></audio>
      <audio id="sx-nm1" class="clip" src="assets/sfx/pop.mp3" data-start="8.88" data-duration="0.72" data-track-index="13" data-volume="0.35"></audio>
      <audio id="sx-nm2" class="clip" src="assets/sfx/pop-2.mp3" data-start="9.38" data-duration="0.91" data-track-index="11" data-volume="0.35"></audio>

      <div id="barra"><img class="lg" src="assets/logo_b.png" alt="Violada T&amp;V" /><div class="dt"><div class="s">SÁBADO</div><div class="d">26 DE</div><div class="m">DEZEMBRO</div></div><img class="ad" src="assets/adega_w.png" alt="Adega Nº1" /></div>
      <div id="pistas" data-composition-id="pistas" data-composition-src="compositions/pistas.html" data-start="0" data-duration="14.6"
        data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="final" data-composition-id="final" data-composition-src="compositions/final.html" data-start="14.6" data-duration="4.9"
        data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      const c = document.getElementById("bg-bokeh").getContext("2d");
      let s = 7; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
      const cols = ["120,60,150", "90,50,140", "140,80,170", "100,40,120"];
      for (let i = 0; i < 80; i++) { const x = r() * 1080, y = r() * 1920, rad = 6 + r() * 22, cl = cols[Math.floor(r() * 4)], al = .08 + r() * .22;
        const g = c.createRadialGradient(x, y, 0, x, y, rad); g.addColorStop(0, `rgba(${cl},${al})`); g.addColorStop(.7, `rgba(${cl},${al * .6})`); g.addColorStop(1, `rgba(${cl},0)`);
        c.fillStyle = g; c.beginPath(); c.arc(x, y, rad, 0, 7); c.fill(); }
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#bg-bokeh", { y: 40 }, { y: -80, duration: 19.5, ease: "none" }, 0);
      tl.fromTo("#bg-tree", { scale: 1.1, opacity: 0 }, { scale: 1, opacity: 0.3, duration: 2, ease: "power2.out" }, 0);
      tl.fromTo("#barra", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.4);
      tl.to("#barra", { opacity: 0, y: 20, duration: 0.25, ease: "power2.in" }, 14.35);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
