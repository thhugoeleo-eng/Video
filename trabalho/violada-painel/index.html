<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #12061d; }
      #root { width: 100%; height: 100%; position: relative;
        background: radial-gradient(ellipse 50% 60% at 20% 30%, #5a1f6e55, transparent 70%), radial-gradient(ellipse 50% 60% at 85% 20%, #3d1c6b55, transparent 70%), linear-gradient(#150822, #1f0b2e 50%, #0d0516); }
      #bg-bokeh { position: absolute; left: 0; top: 0; }
      #bg-tree { position: absolute; left: 160px; top: 0; width: 1600px; opacity: .28; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
      .vl { position: absolute; top: 120px; width: 3px; height: 840px; background: linear-gradient(#b77ad600, #b77ad6 15%, #b77ad6 85%, #b77ad600); opacity: .6; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080">
      <canvas id="bg-bokeh" width="1920" height="1080"></canvas>
      <img id="bg-tree" src="assets/tree2.png" alt="" />
      <div class="vl" style="left:70px" data-layout-ignore></div><div class="vl" style="right:70px" data-layout-ignore></div>
      <audio id="fx-a1" class="clip" src="assets/sfx/whoosh.mp3" data-start="0.00" data-duration="0.57" data-track-index="13" data-volume="0.5"></audio>
      <audio id="fx-a2" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="0.10" data-duration="2.00" data-track-index="11" data-volume="0.45"></audio>
      <audio id="fx-d1" class="clip" src="assets/sfx/whoosh-3.mp3" data-start="5.95" data-duration="0.50" data-track-index="13" data-volume="0.45"></audio>
      <audio id="fx-d2" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="6.08" data-duration="2.00" data-track-index="11" data-volume="0.5"></audio>
      <audio id="fx-d3" class="clip" src="assets/sfx/pop.mp3" data-start="7.00" data-duration="0.72" data-track-index="13" data-volume="0.4"></audio>
      <audio id="fx-s1" class="clip" src="assets/sfx/whoosh-2.mp3" data-start="11.95" data-duration="0.71" data-track-index="11" data-volume="0.45"></audio>
      <audio id="fx-s2" class="clip" src="assets/sfx/pop-2.mp3" data-start="12.90" data-duration="0.91" data-track-index="13" data-volume="0.45"></audio>
      <audio id="fx-s3" class="clip" src="assets/sfx/glitch-3.mp3" data-start="15.40" data-duration="2.00" data-track-index="11" data-volume="0.3"></audio>
      <audio id="fx-s4" class="clip" src="assets/sfx/glitch-3.mp3" data-start="18.60" data-duration="1.70" data-track-index="13" data-volume="0.3"></audio>
      <audio id="fx-l1" class="clip" src="assets/sfx/whoosh.mp3" data-start="19.95" data-duration="0.57" data-track-index="11" data-volume="0.45"></audio>
      <audio id="fx-l2" class="clip" src="assets/sfx/pop.mp3" data-start="20.40" data-duration="0.72" data-track-index="13" data-volume="0.4"></audio>
      <audio id="fx-l3" class="clip" src="assets/sfx/pop-2.mp3" data-start="20.80" data-duration="0.91" data-track-index="11" data-volume="0.4"></audio>
      <audio id="fx-l4" class="clip" src="assets/sfx/pop.mp3" data-start="21.20" data-duration="0.72" data-track-index="13" data-volume="0.4"></audio>
      <audio id="fx-r" class="clip" src="assets/sfx/riser.mp3" data-start="15.97" data-duration="10.03" data-track-index="12" data-volume="0.3"></audio>
      <audio id="fx-f1" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="26.05" data-duration="2.00" data-track-index="13" data-volume="0.55"></audio>
      <div id="abertura" data-composition-id="abertura" data-composition-src="compositions/abertura.html" data-start="0" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="data" data-composition-id="data" data-composition-src="compositions/data.html" data-start="6" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="suspense" data-composition-id="suspense" data-composition-src="compositions/suspense.html" data-start="12" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="lineup" data-composition-id="lineup" data-composition-src="compositions/lineup.html" data-start="20" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="fecho" data-composition-id="fecho" data-composition-src="compositions/fecho.html" data-start="26" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      const c = document.getElementById("bg-bokeh").getContext("2d");
      let s = 11; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
      const cols = ["120,60,150", "90,50,140", "140,80,170", "100,40,120"];
      for (let i = 0; i < 110; i++) { const x = r() * 1920, y = r() * 1080, rad = 6 + r() * 26, cl = cols[Math.floor(r() * 4)], al = .08 + r() * .25;
        const g = c.createRadialGradient(x, y, 0, x, y, rad); g.addColorStop(0, `rgba(${cl},${al})`); g.addColorStop(.7, `rgba(${cl},${al * .6})`); g.addColorStop(1, `rgba(${cl},0)`);
        c.fillStyle = g; c.beginPath(); c.arc(x, y, rad, 0, 7); c.fill(); }
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#bg-bokeh", { y: 30, x: -20 }, { y: -60, x: 20, duration: 30, ease: "none" }, 0);
      tl.fromTo("#bg-tree", { scale: 1 }, { scale: 1.15, duration: 30, ease: "none" }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
